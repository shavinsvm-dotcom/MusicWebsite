name: MOTIF

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The one identifier the account holder must replace. The widget bundle id
    # and the shared app group derive from it, and the app and widget both
    # read the resulting group at runtime.
    APP_BUNDLE_ID: com.example.motif

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.0.0

targets:
  MOTIF:
    type: application
    platform: iOS
    sources:
      - path: MOTIF
        excludes:
          - PrivacyInfo.xcprivacy
      - path: MOTIF/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MOTIF
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MOTIF/MOTIF.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: MOTIFWidgets
        embed: true
      - package: Yams

  MOTIFWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MOTIFWidgets
        excludes:
          - PrivacyInfo.xcprivacy
      - path: MOTIFWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: MOTIF/SharedNowPlaying.swift
      - path: MOTIF/SharedLibrary.swift
    settings:
      base:
        PRODUCT_NAME: MOTIFWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: MOTIFWidgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MOTIFWidgets/MOTIFWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  MOTIF:
    build:
      targets:
        MOTIF: all
    run:
      config: Debug
    archive:
      config: Release
