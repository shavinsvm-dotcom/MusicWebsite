name: MOTIF

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MOTIF:
    type: application
    platform: iOS
    sources:
      - path: MOTIF
    settings:
      base:
        PRODUCT_NAME: MOTIF
        PRODUCT_BUNDLE_IDENTIFIER: com.example.motif
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  MOTIF:
    build:
      targets:
        MOTIF: all
    run:
      config: Debug
    archive:
      config: Release
