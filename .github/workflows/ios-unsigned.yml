name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "!ios/build-error.log"
      - "!ios/audit/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: write

concurrency:
  # Only supersede another attempt for the same commit. A newer commit must
  # not cancel the build that verifies the previous one.
  group: ios-ipa-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build device app without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MOTIF.xcodeproj \
            -scheme MOTIF \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/motif-build.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          rm -rf Payload MOTIF.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MOTIF.app Payload/
          zip -qry MOTIF.ipa Payload

      - name: Verify widget extension
        working-directory: ios
        run: |
          set -euo pipefail
          unzip -l MOTIF.ipa | grep -q 'Payload/MOTIF.app/PlugIns/MOTIFWidgets.appex/MOTIFWidgets'

      - name: Unpack IPA and audit submission metadata
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf /tmp/ipa-audit audit
          mkdir -p /tmp/ipa-audit audit
          unzip -q MOTIF.ipa -d /tmp/ipa-audit

          {
            echo "# Bundle audit"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- IPA sha256: $(shasum -a 256 MOTIF.ipa | awk '{print $1}')"
            echo "- IPA bytes: $(wc -c < MOTIF.ipa | tr -d ' ')"
            echo
          } > audit/report.txt

          python3 - <<'PY' | tee -a audit/report.txt
          import os
          import plistlib
          import re
          import sys

          APP = "/tmp/ipa-audit/Payload/MOTIF.app"
          WIDGET = os.path.join(APP, "PlugIns", "MOTIFWidgets.appex")
          failures = []

          def check(name, ok, detail=""):
              print(("PASS " if ok else "FAIL ") + name + ((" - " + str(detail)) if detail else ""))
              if not ok:
                  failures.append(name)

          check("app bundle present", os.path.isdir(APP), APP)
          check("widget bundle present", os.path.isdir(WIDGET), WIDGET)

          for label, bundle in (("app", APP), ("widget", WIDGET)):
              path = os.path.join(bundle, "PrivacyInfo.xcprivacy")
              check(label + " privacy manifest present", os.path.isfile(path), path)
              if not os.path.isfile(path):
                  continue
              with open(path, "rb") as handle:
                  manifest = plistlib.load(handle)
              check(label + " tracking disabled", manifest.get("NSPrivacyTracking") is False)
              check(label + " no tracking domains", manifest.get("NSPrivacyTrackingDomains") == [])
              check(label + " no collected data types", manifest.get("NSPrivacyCollectedDataTypes") == [])
              apis = manifest.get("NSPrivacyAccessedAPITypes") or []
              defaults = [
                  api for api in apis
                  if api.get("NSPrivacyAccessedAPIType") == "NSPrivacyAccessedAPICategoryUserDefaults"
              ]
              check(label + " UserDefaults declared", len(defaults) == 1)
              if defaults:
                  reasons = defaults[0].get("NSPrivacyAccessedAPITypeReasons") or []
                  check(label + " UserDefaults reason CA92.1", "CA92.1" in reasons, reasons)
              check(label + " only UserDefaults API declared", len(apis) == 1,
                    [api.get("NSPrivacyAccessedAPIType") for api in apis])

          with open(os.path.join(APP, "Info.plist"), "rb") as handle:
              info = plistlib.load(handle)

          check("CFBundleIdentifier", info.get("CFBundleIdentifier") == "com.example.motif",
                info.get("CFBundleIdentifier"))
          motion = info.get("NSMotionUsageDescription")
          check("motion usage description", isinstance(motion, str) and len(motion.strip()) > 10, motion)
          check("export compliance declared", info.get("ITSAppUsesNonExemptEncryption") is False)
          check("launch screen declared", isinstance(info.get("UILaunchScreen"), dict))
          check("background audio mode", info.get("UIBackgroundModes") == ["audio"])
          check("portrait only", info.get("UISupportedInterfaceOrientations") == ["UIInterfaceOrientationPortrait"])
          check("marketing version",
                bool(re.fullmatch(r"\d+(\.\d+){0,2}", str(info.get("CFBundleShortVersionString", "")))),
                info.get("CFBundleShortVersionString"))
          check("build number",
                bool(re.fullmatch(r"\d+", str(info.get("CFBundleVersion", "")))),
                info.get("CFBundleVersion"))
          check("minimum iOS 16", str(info.get("MinimumOSVersion", "")).startswith("16"),
                info.get("MinimumOSVersion"))
          check("display name", info.get("CFBundleDisplayName") == "Lilt", info.get("CFBundleDisplayName"))
          check("compiled icon",
                bool(info.get("CFBundleIcons")) or bool(info.get("CFBundleIconName"))
                or any(name.startswith("AppIcon") for name in os.listdir(APP)))

          documents = info.get("CFBundleDocumentTypes") or []
          check("one audio document type", len(documents) == 1, len(documents))
          if documents:
              document = documents[0]
              types = document.get("LSItemContentTypes") or []
              check("document role editor", document.get("CFBundleTypeRole") == "Editor",
                    document.get("CFBundleTypeRole"))
              check("document rank alternate", document.get("LSHandlerRank") == "Alternate",
                    document.get("LSHandlerRank"))
              for uti in ("public.audio", "public.mp3", "public.mpeg-4-audio"):
                  check("accepts " + uti, uti in types, types)
          check("opens documents in place", info.get("LSSupportsOpeningDocumentsInPlace") is True)

          def walk(node, path=""):
              if isinstance(node, dict):
                  for key, value in node.items():
                      yield from walk(value, path + "." + str(key))
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      yield from walk(value, path + "[" + str(index) + "]")
              else:
                  yield path, node

          allowed = {".CFBundleIdentifier", ".CFBundleURLTypes[0].CFBundleURLName"}
          leaks = [(p, v) for p, v in walk(info)
                   if isinstance(v, str) and "com.example" in v and p not in allowed]
          check("no placeholder metadata outside identifier keys", not leaks, leaks[:5])

          unresolved = [(p, v) for p, v in walk(info) if isinstance(v, str) and "$(" in v]
          check("no unresolved build settings", not unresolved, unresolved[:5])

          with open(os.path.join(WIDGET, "Info.plist"), "rb") as handle:
              widget_info = plistlib.load(handle)
          check("widget bundle id suffix",
                str(widget_info.get("CFBundleIdentifier", "")).endswith(".widgets"),
                widget_info.get("CFBundleIdentifier"))
          check("widget extension declared", isinstance(widget_info.get("NSExtension"), dict))

          print()
          if failures:
              print("AUDIT FAILED: " + ", ".join(failures))
              sys.exit(1)
          print("AUDIT PASSED")
          PY

          cp /tmp/ipa-audit/Payload/MOTIF.app/PrivacyInfo.xcprivacy audit/app-PrivacyInfo.xcprivacy
          cp /tmp/ipa-audit/Payload/MOTIF.app/PlugIns/MOTIFWidgets.appex/PrivacyInfo.xcprivacy audit/widget-PrivacyInfo.xcprivacy
          plutil -convert xml1 -o audit/app-Info.plist /tmp/ipa-audit/Payload/MOTIF.app/Info.plist
          plutil -convert xml1 -o audit/widget-Info.plist /tmp/ipa-audit/Payload/MOTIF.app/PlugIns/MOTIFWidgets.appex/Info.plist
          shasum -a 256 audit/*.xcprivacy audit/*.plist >> audit/report.txt
          cat audit/report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Capture simulator screenshots
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 18
        working-directory: ios
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          chosen = ""
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              phones = [d for d in data[runtime]
                        if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
              if phones:
                  chosen = phones[0]["udid"]
                  break
          print(chosen)
          ')
          test -n "$DEVICE_ID"
          stage() { echo "=== $(date -u +%H:%M:%S) $* ===" | tee -a /tmp/motif-screenshots.log; }
          echo "Simulator: $DEVICE_ID" | tee /tmp/motif-screenshots.log
          stage "boot simulator"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          for attempt in $(seq 1 60); do
            if xcrun simctl getenv "$DEVICE_ID" HOME >/dev/null 2>&1; then break; fi
            sleep 2
          done
          xcrun simctl getenv "$DEVICE_ID" HOME >/dev/null

          stage "build simulator app"
          xcodebuild \
            -project MOTIF.xcodeproj \
            -scheme MOTIF \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            -disableAutomaticPackageResolution \
            >> /tmp/motif-screenshots.log 2>&1

          stage "install app"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'MOTIF.app' -print -quit)
          test -d "$APP"
          xcrun simctl uninstall "$DEVICE_ID" com.example.motif 2>/dev/null || true
          xcrun simctl install "$DEVICE_ID" "$APP"

          launch() {
            stage "launch app ($1)"
            xcrun simctl terminate "$DEVICE_ID" com.example.motif 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" com.example.motif \
              --motif-screenshots --motif-screen="$1" \
              >> /tmp/motif-screenshots.log
            sleep 8
          }
          shot() {
            stage "capture $1"
            xcrun simctl io "$DEVICE_ID" screenshot "audit/$1.png" >> /tmp/motif-screenshots.log
            sips -Z 1100 "audit/$1.png" >/dev/null
            echo "captured audit/$1.png"
          }

          stage "home"
          launch home
          shot home
          launch library
          shot library
          launch lyrics
          shot lyrics
          launch player
          shot player
          launch settings
          shot settings

          for name in home library lyrics player settings; do
            test -f "audit/$name.png" || { echo "MISSING audit/$name.png"; ls -la audit; exit 1; }
          done
          echo "- Simulator screenshots: home, library, lyrics, player, settings (captured on $DEVICE_ID)" >> audit/report.txt

      - name: Publish bundle audit
        if: always()
        working-directory: ios
        run: |
          set -euo pipefail
          test -d audit || exit 0
          test -n "$(ls -A audit)" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/bundle-audit
          git add -f audit/report.txt
          for file in audit/*.png audit/*.plist audit/*.xcprivacy; do
            if [ -e "$file" ]; then git add -f "$file"; fi
          done
          git commit -m "Bundle audit for ${GITHUB_SHA} [skip ci]"
          git push --force origin HEAD:ci/bundle-audit

      - name: Upload bundle audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-audit
          path: |
            ios/audit/*.txt
            ios/audit/*.png
            ios/audit/*.plist
            ios/audit/*.xcprivacy
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MOTIF-unsigned-ipa
          path: ios/MOTIF.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish build errors
        if: failure()
        run: |
          echo "# Run ${GITHUB_RUN_ID} (${GITHUB_SHA})" > build-error.log
          if [ -f /tmp/motif-build.log ]; then
            { echo '### Xcode errors'; grep -nE 'error:|warning:' /tmp/motif-build.log | tail -n 120; } >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 500 /tmp/motif-build.log > build-error.log
          fi
          if [ -f /tmp/motif-screenshots.log ]; then
            { echo; echo '### Simulator errors'; grep -nE 'error:|failed' /tmp/motif-screenshots.log | tail -n 120; } >> "$GITHUB_STEP_SUMMARY" || true
            { echo; echo '### Simulator log'; tail -n 800 /tmp/motif-screenshots.log; } >> build-error.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci/build-log
          git add -f build-error.log
          git commit -m 'Record build failure [skip ci]'
          git push --force origin HEAD:ci/build-log
