name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build device app without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MOTIF.xcodeproj \
            -scheme MOTIF \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/motif-build.log

      - name: Publish build errors
        if: failure()
        run: |
          if [ -f /tmp/motif-build.log ]; then
            { echo '### Xcode errors'; grep -nE 'error:|warning:' /tmp/motif-build.log | tail -n 120; } >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 500 /tmp/motif-build.log > build-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -B ci/build-log
            git add -f build-error.log
            git commit -m 'Record Xcode build failure'
            git push --force origin HEAD:ci/build-log
          fi

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          rm -rf Payload MOTIF.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MOTIF.app Payload/
          zip -qry MOTIF.ipa Payload

      - name: Verify widget extension
        working-directory: ios
        run: |
          set -euo pipefail
          unzip -l MOTIF.ipa | grep -q 'Payload/MOTIF.app/PlugIns/MOTIFWidgets.appex/MOTIFWidgets'

      - name: Verify IPA contents
        working-directory: ios
        run: unzip -l MOTIF.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MOTIF-unsigned-ipa
          path: ios/MOTIF.ipa
          if-no-files-found: error
          retention-days: 14
